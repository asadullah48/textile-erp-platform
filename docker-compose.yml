# Full stack for local evaluation: `cp .env.example .env && docker compose up --build`
# App: http://localhost:3000 · API docs: http://localhost:8000/docs
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      APP_DB_USER: textile_app
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-app_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Creates the least-privilege role the API connects as (first start only).
      - ./backend/scripts/docker-init-app-role.sh:/docker-entrypoint-initdb.d/10-app-role.sh:ro
      - ./backend/scripts/create_app_role.sql:/scripts/create_app_role.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # POSTGRES_USER is a superuser (bypasses RLS) → migrations only.
      MIGRATIONS_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      DATABASE_URL: postgresql+asyncpg://textile_app:${APP_DB_PASSWORD:-app_password}@postgres:5432/${POSTGRES_DB}
      SECRET_KEY: ${SECRET_KEY}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-480}
      ALLOWED_ORIGINS: http://localhost:3000
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')\""]
      interval: 10s
      timeout: 5s
      retries: 12

  frontend:
    build:
      context: ./frontend
      args:
        # Read by the *browser*, so it must be a host the browser can reach —
        # not the compose service name.
        NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"

volumes:
  postgres_data:
