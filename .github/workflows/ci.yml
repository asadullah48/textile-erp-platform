name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: textile_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: textile_erp
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U textile_user -d textile_erp"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://textile_user:ci_password@localhost:5432/textile_erp
      SECRET_KEY: ci_secret_key_at_least_32_characters_long
      ACCESS_TOKEN_EXPIRE_MINUTES: "480"
      ALLOWED_ORIGINS: '["http://localhost:3000"]'
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --extra test
      - run: uv run alembic upgrade head
      - run: uv run pytest -x -v

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
