name: CI

on:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: textile_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: textile_erp
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U textile_user -d textile_erp"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # The official postgres image makes POSTGRES_USER a superuser, and superusers
      # ignore RLS. Migrations run as that owner; the app and tests run as a
      # least-privilege role so tenant isolation is genuinely exercised.
      MIGRATIONS_DATABASE_URL: postgresql+asyncpg://textile_user:ci_password@localhost:5432/textile_erp
      DATABASE_URL: postgresql+asyncpg://textile_app:app_password@localhost:5432/textile_erp
      SECRET_KEY: ci_secret_key_at_least_32_characters_long
      ACCESS_TOKEN_EXPIRE_MINUTES: "480"
      ALLOWED_ORIGINS: '["http://localhost:3000"]'
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --extra test
      - name: Create least-privilege app role
        run: >
          psql "postgresql://textile_user:ci_password@localhost:5432/textile_erp"
          -v app_user=textile_app -v app_password=app_password -f scripts/create_app_role.sql
      - run: uv run alembic upgrade head
      - name: Migrations are reversible
        run: uv run alembic downgrade 002 && uv run alembic upgrade head
      - run: uv run pytest -v

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - name: Build (real-backend mode)
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
      - name: Build (browser demo mode, as deployed to Vercel)
        run: npm run build
        env:
          NEXT_PUBLIC_DEMO_MODE: browser
